      "sources": [
        {
          "claim_id": "NZ01",
          "url": "https://www.tenancy.govt.nz/healthy-homes/healthy-homes-compliance/",
          "accessed": "2026-09-26T20:08:04.552703+00:00",
          "quote": "Healthy homes compliance timeframes\nAll rental properties must comply with the healthy homes standards as of 1 July 2025. Landlords are responsible for ensuring their properties meet the standards.\nKey compliance dates for healthy homes:\nFrom 1 July 2025, all private rentals must comply with the healthy homes standards.\nAll houses rented by Kāinga Ora (formerly Housing New Zealand) and registered Community Housing Providers had to comply by 1 July 2024.\nChanges to the compliance timeframes took effect on 26 November 2022 for private landlords.\nAll boarding houses had to comply by 1 July 2021.\nFrom 1 December 2020 landlords had to include a statement of their current level of compliance.\nFrom 1 July 2019 landlords had to sign a statement of intent to comply and keep records that demonstrate compliance with relevant healthy homes standards.\nTenancies started or renewed between 1 July 2021 and 27 August 2022 must have complied with the healthy homes standards within 90 days.\nTenancies started or renewed between 28 August 2022 and 2 March 2025 must comply with the healthy homes standards within 120 days."
        },
        {
          "claim_id": "NZ02",
          "url": "https://www.tenancy.govt.nz/healthy-homes/healthy-homes-compliance/",
          "accessed": "2026-09-26T20:08:04.552703+00:00",
          "quote": "What are the standards?\nHeating\nLandlords must provide one or more fixed heaters that can directly heat the main living room. The heater(s) must be acceptable types and must meet the minimum heating capacity required for your main living room.\nHeating standard\nInsulation\nCeiling and underfloor insulation has been compulsory in all rental homes since 1 July 2019. The healthy homes insulation standard builds on the current regulations and some existing insulation will need to be topped up or replaced.\nInsulation standard\nVentilation\nEach livable space must have a window or door that opens to the outside and can be fixed in the open position. Kitchens and bathrooms must also have an extractor fan to remove moisture.\nVentilation standard\nMoisture ingress and drainage\nA rental property must have efficient drainage, guttering and downpipes for the removal of stormwater, surface water and ground water.\nWhere there is an enclosed sub-floor, a ground moisture barrier is required.\nMoisture ingress and drainage standard\nDraught stopping\nLandlords must block any unreasonable gaps or holes, in walls, ceilings, windows, floors and doors, that cause noticeable draughts.\nDraught stopping standard\nWhen the standards do not apply\nIn some situations, a property is not required to meet the healthy homes standards or parts of the standards. This is called an exemption.\nExemptions to the healthy homes standards\nYour ongoing responsibility\nOnce your property is up to standard, you need to make sure it stays that way."
        },
        {
          "claim_id": "NZ03",
          "url": "https://www.tenancy.govt.nz/healthy-homes/healthy-homes-compliance/",
          "accessed": "2026-09-26T20:08:04.552703+00:00",
          "quote": "What to include in the tenancy agreement\nNew or renewed tenancy agreements must include a signed statement with details of the property’s current level of compliance with the standards. We have a template you can use for this.\nCompliance statement\nLandlords who do not include this statement when required could face a financial penalty of up to $500 for each tenancy, or other enforcement action.\nRecords to keep\nLandlords must keep all records and documents that show how they are complying with the healthy homes standards. These must be made available on request.\nTenants can also request information about compliance with the healthy homes standards. Landlords must provide this information to tenants within 21 days."
        },
        {
          "claim_id": "NZ04",
          "url": "https://www.tenancy.govt.nz/healthy-homes/compliance-statement/",
          "accessed": "2026-09-26T20:06:20.452751+00:00",
          "quote": "All new or renewed tenancy agreements must include specific information about the rental property’s current level of compliance with the healthy homes standards.\nOn this page\nAbout healthy homes compliance\nAbout the compliance statement template\nWhat needs to be included in the statement\nAbout healthy homes compliance\nAll rental properties must comply with the healthy homes standards. New, renewed or varied tenancy agreements must include a signed statement with details of the property’s current level of compliance with the standards. Landlords who do not meet their obligations under the healthy homes standards are in breach of the Residential Tenancies Act 1986 – and may face consequences, like financial penalties of up to $7200."
        },
        {
          "claim_id": "NZ05",
          "url": "https://www.tenancy.govt.nz/healthy-homes/compliance-statement/",
          "accessed": "2026-09-26T20:06:20.452751+00:00",
          "quote": "The required heating capacity for the main living room to reach at least 18°C. This needs to be included if using any of the following options to calculate heating capacity:\nThe online heating assessment tool.\nThe heating formulas in the regulations.\nA qualified heating specialist to assess the required heating capacity.\nIf applicable, confirming the new heating formula for modern dwellings (homes) or relevant apartments is being used to calculate the required heating capacity. This should include a brief description as to why the property meets the criteria to use the new heating formula.\nIf the property is meeting the standard by using a qualified specialist to assess what heating capacity is acceptable the landlord must:\nProvide a statement explaining that they are relying on regulation 10A and include a description of why regulation 10A applies.\nState the name and relevant qualifications of the specialist.\nHold in their records details of how the heating complies with regulation 10A and how the qualified specialist calculated the required heating capacity.\nHold documentation to record compliance when the required heating has been installed."
        },
        {
          "claim_id": "NZ06",
          "url": "https://www.tenancy.govt.nz/healthy-homes/compliance-statement/",
          "accessed": "2026-09-26T20:06:20.452751+00:00",
          "quote": "The insulation standard\nIf any of the below information is already provided as part of a separate insulation statement in the tenancy agreement, it does not need to be included again in the compliance statement.\nFor each ceiling insulated, either:\nthe R-value of the insulation and, if known, the date it was installed and when it was last inspected, or\nthe thickness of the insulation and, if known, the date when it was last inspected.\nFor each underfloor space, the R-value of the insulation and, if known, the date it was installed and when it was last inspected.\nFor each ceiling and suspended floor that isn’t insulated, the reason why not.\nStatements issued by certified installers\nLandlords are required by law to provide a signed insulation statement that includes all information required as part of the Residential Tenancies (Smoke Alarms and Insulation) Regulations 2016, as well as information required under the healthy homes standards (e.g. R-values).\nThe healthy homes compliance statement template is designed to meet the information requirements of both of these. It is a combined statement that only needs to be signed once.\nTo meet the requirements, the statements must be ‘made and signed’ by the landlord or an agent acting as the landlord (such as a property manager).\nLandlords can use a professional to assess the insulation in their property and include that information in their compliance statement, but the landlord must sign the statement not the professional.\nInformation about wall insulation\nThe compliance statement template includes a page relating to wall insulation. This example statement is intended to address the information requirements for insulation under the Residential Tenancies (Healthy Homes Standards) Regulations 2019, as well as the disclosure requirements set out in section 13A of the Residential Tenancies Act 1986.\nLandlords must make a reasonable effort to find out whether their rental property has wall insulation, but wall insulation is not required by the Residential Tenancies Act.\nIf you are not able to get this information, landlords must specify what they are unable to find out in relation to the location, type and condition of ceiling, underfloor or wall insulation. They must also provide the reasons why they are unable to, and that they have made a reasonable effort to find out."
        },
        {
          "claim_id": "NZ07",
          "url": "https://www.tenancy.govt.nz/healthy-homes/compliance-statement/",
          "accessed": "2026-09-26T20:06:20.452751+00:00",
          "quote": "The ventilation standard\nLandlords must include the following information for the ventilation standard:\nA statement that each habitable space in the premises has one or more openable windows or doors (that meet the requirements detailed in the ventilation section):\nDetails of how the home complies with the ventilation requirement. All kitchens and bathrooms must have an extractor fan vented to the outside or the home must have a qualifying ventilation system that continuously extracts to the outdoors from the kitchen(s) or bathroom(s).\nIf complying by extractor fans this must include the diameter or exhaust capacity of each extractor fan installed in any kitchen or bathroom.\nIf complying by using a qualifying ventilation system the statement must include a brief description of how the ventilation meets the definition of qualifying ventilation system to meet the standard. The description must also include it’s exhaust capacity. For example, the date consent was given and how it extracts air to the outside.\nVentilation standard\nInformation required for moisture and drainage standard\nLandlords must include the following information for the moisture and drainage standard:\nA statement that the rental property has an efficient drainage system.\nEither:\nthat the property does not have any enclosed subfloor spaces, or\nthat each enclosed subfloor space has a ground moisture barrier.\nMoisture and drainage standard\nThe draught stopping standard\nLandlords must include the following information for the draught stopping standard:\nA statement that any open fireplace is either closed off and the chimney is blocked, or the chimney is not blocked due to a written request from the tenant.\nA statement that the property is free from unreasonable gaps that allow draughts into or out of the premises.\nDraught stopping standard\nExemptions\nIf an exemption applies, the landlord must make a statement explaining the exemption and briefly describe the circumstances that led to the exemption.\nExemptions to the healthy homes standards"
        },
        {
          "claim_id": "NZ08",
          "url": "https://www.tenancy.govt.nz/healthy-homes/healthy-homes-standards-what-a-landlord-needs-to-know/keeping-your-property-up-to-standard/",
          "accessed": "2026-09-26T20:08:06.677529+00:00",
          "quote": "Once your property meets the healthy homes standards, you’ll need to make sure that it stays that way.\nIf something is installed, or provided, to meet any of the healthy homes standards, it must be maintained in good working order. If it cannot be kept in good working order, it must be replaced.\nAs soon as you are made aware that something needs maintenance or repair (through no fault of the tenant), you must remedy it or arrange for it to be remedied within a reasonable timeframe. A ‘reasonable timeframe’ will differ from situation to situation, depending on the availability of appropriate industry professionals, replacement parts and components.\nYou should also keep your tenants updated on the progress of any maintenance or repairs and keep records of the process, for example, dates professionals were contacted.\nHere are some tips to help you keep your property up to scratch:\nAt the start of a tenancy\nMake sure you include the healthy homes standards compliance statement in the tenancy agreement, and that it has been updated with any new information."
        },
        {
          "claim_id": "NZ12",
          "url": "https://www.tenancy.govt.nz/maintenance-and-inspections/access/",
          "accessed": "2026-09-26T20:08:10.716711+00:00",
          "quote": "Landlords can enter their rental properties at certain times, for certain things. They must give the right amount of notice or get their tenant’s permission. They must also respect the tenant’s reasonable peace, comfort and privacy.\nThe property is the tenant’s home\nThe landlord owns the property, but the property is the tenant's home while they are renting it. This means the landlord must respect the tenant's peace, comfort and privacy. This is called \"quiet enjoyment\".\nQuiet enjoyment\nLandlords can enter their rental properties for various reasons. If the landlord needs to enter the inside of a rental property (to do an inspection or to fix something, for example), they need to give the correct amount of notice or get the tenant’s permission. Otherwise, they may be committing an unlawful act.\nThe landlord can enter the property if they have a Tenancy Tribunal order allowing entry, or if there is an emergency, such as flooding or a fire.\nLandlords can enter the property for inspections\nLandlords can regularly inspect their rental properties. This helps make sure that:\neverything is in working order\nany damage to the property is identified, and\nthe property is being kept reasonably clean and tidy.\nSome insurance providers require the landlord to prove that regular property inspections are taking place.\nLandlords must follow certain rules when scheduling or conducting an inspection.\nInspections\nLandlords can enter the property to fix something\nLandlords must give tenants at least 24 hours’ notice before they or their contractors enter the property to do any necessary repairs or maintenance. These repairs can be done between 8am and 7pm (or between 8am and 6pm for boarding houses).\nThe persons responsible for fixing and paying for repairs in a rental property will depend on exactly what needs to be repaired or maintained.\nDamage and repairs\nAny repairs or maintenance that are not necessary, like cosmetic improvements, can only be done at an agreed time by the landlord and tenant."
        },
        {
          "claim_id": "NZ13",
          "url": "https://www.tenancy.govt.nz/maintenance-and-inspections/access/",
          "accessed": "2026-09-26T20:08:10.716711+00:00",
          "quote": "Landlords must not use force to enter the property\nThe landlord must not use force, or threat of force, to enter or attempt to enter the property while the tenant, or anyone with the tenant’s permission, is inside. A landlord who does this commits an offence and is liable on conviction for a financial penalty or imprisonment."
        }
      ],
