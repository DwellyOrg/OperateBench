    "AU_VIC_RENTAL_CHECKS": {
      "profile_id": "AU_VIC_RENTAL_CHECKS",
      "profile_version": "2026-09-26.v1",
      "jurisdiction": "Australia/Victoria",
      "source_claims": [
        "VI01",
