      "sources": [
        {
          "claim_id": "SC01",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/",
          "accessed": "2026-09-26T20:06:16.295774+00:00",
          "quote": "Summary\nThis guidance incorporates all the elements of the Repairing Standard which private landlords are required to comply with from 1 March 2024. The aim of the guidance is to equip private landlords with full detail of what they should do to ensure compliance with all the Repairing Standard.\nShort Term Lets hosts/operators are also required to meet the Repairing Standard and this guidance is for use in determining whether they meet the required standards (see\nparagraph 2.5\n). The terms landlord, let and tenant when used in this guidance will be understood to apply accordingly to short term lets.\nFor some types of tenancies on agricultural holdings, the Repairing Standard will be enforceable from 28 March 2027 (see\nsection 8\n)."
        },
        {
          "claim_id": "SC02",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/pages/16/",
          "accessed": "2026-09-26T20:07:08.422458+00:00",
          "quote": "D.56 Landlords are required to ensure an electrical safety inspection comprising of periodic inspection and testing (PI & T) of the electrical installation and 'In-service inspection and testing of electrical equipment’ (also known as\nPAT\ntesting) is carried out by a skilled person(s) competent in such work before the property is let for the first time, and then at intervals of no more than five years. This does not have to be completed immediately before a new tenancy begins or every time a new tenancy starts, as long as it has been carried out in the period of 5 years before the tenancy starts. As set out in D.73, A landlord who has an Electrical Installation Certificate for a property can provide this for the purpose of PI & T to comply with this guidance.\nD.57 The purpose of PI & T and In-Service Inspection and Testing of Electrical Equipment is to confirm, so far as reasonably practicable, that the electrical installation, fixtures, fittings, accessories and equipment are in a satisfactory condition for continued service, and identify any damage, deterioration, defects or dangerous conditions that may exist which could affect the ongoing safety of the electrical installation, fixtures, fittings, accessories or equipment. Appropriate remedial work may need to be carried out to ensure that they are maintained in a satisfactory condition for continued service, a reasonable state of repair, and in proper working order.\nD.58 Tenants cannot be required to pay for or contribute towards the cost of an electrical safety inspection, unless ordered to do so by the First-tier Tribunal for Scotland.\nD.59 If a landlord cannot carry out an inspection because they do not have right of access to all or part of the property, or lack any other necessary right, they are not in breach of their duties in relation to the Repairing Standard, provided that they have taken reasonable steps to acquire that right. Electrical Installation Condition Report"
        },
        {
          "claim_id": "SC03",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/pages/16/",
          "accessed": "2026-09-26T20:07:08.422458+00:00",
          "quote": "D.61 The\nEICR\nmust be completed by a skilled person suitably competent in such work. This means a skilled person (electrically) which is defined in\nBS\n7671 as:\nSkilled person (electrically). Person who possesses, as appropriate to the nature of the electrical work to be undertaken, adequate education, training and practical skills, and who is able to perceive risks and avoid hazards which electricity can create.\nThe term (‘electrically)’ is assumed to be present where the term 'skilled person' is used throughout\nBS\n7671.\nRegulation 16 of the Electricity at Work Regulations 1989 requires persons to be competent to prevent danger and injury.\nThis means that a skilled person must be:\nEmployed by a company that is a member of an accredited registration scheme operated by a recognised body,\nA sole trader or self-employed individual who is a member of an accredited registration scheme operated by a recognised body, or\nAn individual who is able to satisfactorily complete the checklist provided on the following page of this guidance.\nD.62 In this part of the guidance (\nannex D3\n), accredited registration scheme operated by a recognised body means those operated by the\nSELECT\n(Electrical Contractors' Association of Scotland),\nNICEIC\n, or\nNAPIT\n(the National Association of Professional Inspectors and Testers). Landlords can take membership of these organisations as evidence that the company or individual has been assessed to the same level as required in the statutory guidance checklist and has the necessary capability to carry out such work. Alternatively, a skilled person (other than a member of\nNICEIC\n,\nSELECT\nor\nNAPIT\n) should be able to confirm all of the points listed in the checklist form provided on the following page."
        },
        {
          "claim_id": "SC04",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/pages/16/",
          "accessed": "2026-09-26T20:07:08.422458+00:00",
          "quote": "D.64 The skilled person carrying out the inspection must complete the\nEICR\naccurately and legibly clearly setting out –\nThe date of the inspection\nThe full address of the house inspected\nThe name and address of the landlord or their agent\nThe name and address of the person carrying out the inspection\nEvidence that person completing the inspection report is a suitably skilled person competent in such work (see\nAnnex A\n)\nA description of each installation, fixture and fitting inspected, and its location in the house, and\nAny defect(s) identified"
        },
        {
          "claim_id": "SC05",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/pages/16/",
          "accessed": "2026-09-26T20:07:08.422458+00:00",
          "quote": "D.66 Any electrical installation, fixtures, fittings or equipment which fails to pass electrical safety inspection must be replaced or repaired to comply with the Repairing Standard.\nD.67 Any element of the electrical installations, fixtures, fittings or equipment recorded in Section K of the\nEICR\nas being an observation with Classification Code C1 (Danger present) or C2 (potentially dangerous) must be rectified to comply with the Repairing Standard.\nD.68 Classification Code C1 means that anyone using the installation is at risk and remedial work should be carried out by an electrically skilled person immediately. If it is practical to do so, the competent person should make the installation safe on discovery of the dangerous condition. Where this is not practical the owner or user should be given written notification as a matter of urgency.\nD.69 Where an item is given a Classification Code C2 this is a potentially dangerous situation and urgent remedial action is required.\nD.70 Where an item is given a Classification Code C3, this is a recommended improvement. An observed inadequacy in this category is not considered to be a source of immediate or potential danger. Whilst remedial action is not necessarily required to meet with the Repairing Standard, such improvements would contribute to an enhancement of the safety of the electrical installation. Therefore, landlords should consider addressing these items where possible.\nD.71 Any element of the electrical installation given a Classification Code\nFI\n(Further Investigation required without delay) in an\nEICR\nshould be investigated as soon as practically possible as such investigation may reveal a dangerous or potentially dangerous condition. For more information about electrical installation testing and the classification codes, refer to the latest version of\nElectrical Safety First’s Best Practice Guide\nNo 4 ‘Electrical installation condition reporting: Classification Codes for domestic and similar electrical installations’.\nD.72 An\nEICR\nwill recommend any remedial action required in order to ensure that the electrical installation is in a satisfactory condition for continued service, but any work which is undertaken must be recorded separately. This can be done by recording the work completed on a Minor Electrical Installation Works Certificate and providing a copy of that to the person ordering the work. This is recommended for all actions to remedy a defect. If remedial work includes replacement of a consumer unit (known by some as a fuse box) an Electrical Installation Certificate (\nEIC\n) shall be provided."
        },
        {
          "claim_id": "SC07",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/pages/16/",
          "accessed": "2026-09-26T20:07:08.422458+00:00",
          "quote": "D.77 Any electrical equipment which fails to pass a In-Service Inspection and Testing of Electrical Equipment must be replaced or repaired immediately to comply with the Repairing Standard.\nD.78 The in-service inspection and testing of electrical equipment must be completed by a suitably competent person. For the purpose of In-Service Inspection and Testing of Electrical Equipment this means either:\nA skilled person (electrically) as set out in paragraph D.61 above, or\nA person (including the landlord) who has completed appropriate training for In-Service Inspection and Testing of Electrical Equipment.\nD.79 A landlord, or other person, is considered competent to carry out In-Service Inspection and Testing of Electrical Equipment if they have successfully completed an appropriate assessed training qualification. Organisations offering In-Service Inspection and Testing of Electrical Equipment courses include -"
        },
        {
          "claim_id": "SC08",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/pages/16/",
          "accessed": "2026-09-26T20:07:08.422458+00:00",
          "quote": "D.81 Electrical equipment that was purchased new less than one year before the date of the test does not require to be included in the In-Service Inspection and Testing of Electrical Equipment. Equipment that was purchased second hand should however be included. If there is any doubt about the condition or age of an appliance or the date of purchase it should be included in the test. If equipment is new it should be included in the equipment register and the date that its first test is due should be clearly recorded.\nD.82 The duty to carry out electrical safety inspections does not apply to appliances that belong to tenants, only to appliances provided by the landlord.\nD.83 The date for retesting appliances is usually set during the In-Service Inspection and Testing of Electrical Equipment and will usually be more frequent than five years. If the skilled person recommends more frequent checks then the landlord should take account of this and follow the advice provided on frequency of inspection and test. If the In-Service Inspection and Testing of Electrical Equipment is not carried out by the skilled person undertaking the\nEICR\n, the skilled person should confirm that the equipment report is complete and up to date. The skilled person does not have to re‑perform the testing if the re-test date has not passed/expired, there is a record of the equipment having been inspected and tested and labelled to confirmed satisfactory for continued use. If there is any equipment that requires to be inspected and tested this can be done at the time of the PI & T. It is not necessary to retest appliances that have an up-to-date test.\nD.84 The landlord must receive and keep a copy of the\nEICR\nfor six years. A copy of the most recent\nEICR\nmust be given to any person who is to become a tenant before a tenancy starts. If an inspection is carried out during a tenancy a copy relating to that inspection must be given to the tenant.\nElectrical Safety: Periodic Tests and inspections\nD.85 Landlords should ensure that electrical safety inspection are carried out:\nBefore a tenancy starts, and\nDuring the tenancy, at intervals of no more than 5 years from the date of the previous inspection.\nD.86 The minimum standard to comply with the legislation is that an inspection must be carried out at least every 5 years, but this does not preclude more frequent testing where appropriate."
        },
        {
          "claim_id": "SC11",
          "url": "https://www.gov.scot/publications/repairing-standard-statutory-guidance-private-landlords/pages/7/",
          "accessed": "2026-09-26T20:07:08.384977+00:00",
          "quote": "6.4 Private landlords are required to register with their local authority, under Part 8 of the Antisocial Behaviour etc. (Scotland) Act 2004, to ensure that they are \"fit and proper\" to be letting property. Although legislation regarding landlord registration is set by the Scottish Government, it is the responsibility of the local authority to investigate and take any necessary action arising from complaints from tenants of private rented properties.\n6.5 If a landlord needs to access a property to carry out repairs or check the condition of the property and access can’t be agreed with the tenant, the landlord should apply to the First-tier Tribunal for Scotland for help with access using the Right Of Entry procedure – see\nRight of Entry - Housing and Property Chamber\n."
        }
      ],
