      ],
      "sources": [
        {
          "claim_id": "VI01",
          "url": "https://www.consumer.vic.gov.au/housing/renting/repairs-alterations-safety-and-pets/gas-electrical-and-water-safety-standards/rental-providers-gas-and-electrical-safety",
          "accessed": "2026-09-26T20:07:10.378390+00:00",
          "quote": "Gas safety checks\nGas appliances such as heaters, stoves and gas fired hot water systems, must be properly maintained. If gas appliances aren’t maintained, they can cause carbon monoxide poisoning.\nRental providers who enter into a new agreement after 29 March 2021, must have gas safety checks conducted every 2 years by a licensed or registered gasfitter.\nIt is not legislated that rental providers who entered into an agreement before 29 March 2021 conduct gas safety checks. But rental providers are strongly encouraged to conduct these checks, keep records of the checks and provide a copy to the renter.\nIf a gas safety check has not been conducted within the last 2 years at the time a renter occupies the rental premises, a gas safety check is to be completed as soon as possible.\nBefore entering into a rental agreement, a rental provider must disclose to a renter the date of the last gas safety check, and any outstanding recommendations from the safety check.\nFor fixed term rental agreements entered into before 29 March 2021, which have rolled over into a periodic rental agreement before this date, rental providers are encouraged to conduct periodic gas safety checks. This may help to ensure they meet their obligations under the\nResidential Tenancies Act 1997\nwhich requires rental providers to supply a rental property that is maintained in good repair and is reasonably fit and suitable for occupation.\nWho can do a gas safety check?\nThe check must be conducted by a licensed or registered gasfitter who is endorsed in the specialised class of Type A Gas Appliances Servicing - Gas Servicing Type A on the Plumbers Identity Card."
        },
        {
          "claim_id": "VI02",
          "url": "https://www.consumer.vic.gov.au/housing/renting/repairs-alterations-safety-and-pets/gas-electrical-and-water-safety-standards/rental-providers-gas-and-electrical-safety",
          "accessed": "2026-09-26T20:07:10.378390+00:00",
          "quote": "Evidence of gas safety check\nThe gas fitter should provide a record of the gas safety check. The document must include:\nthe full name and business details, including the licence or registration number, of the gasfitter who did the check\nthe date the safety check was conducted\nthe results of the check, including any servicing and repairs required and actions taken to address the repair.\na copy of the record of gas servicing work submitted to the BPC and given to the rental provider under the Gas Safety (Gas Installation) Regulations 2018, for each Type A gas appliance that is serviced as part of the standard gas installation.\nRecord keeping\nRental providers must keep a record of gas safety checks until a record of the next safety check is created.\nA copy of the most recent gas safety check must be provided to the renter within 7 days after the rental provider receives a written request from the renter.\nElectrical safety checks\nRental providers who enter into a new agreement after 29 March 2021, must have all electrical installations and fittings checked by a licensed electrician at least once every 2 years. This also applies to rental agreements where a fixed term agreement rolls over into a periodic rental agreement after 29 March 2021.\nIf an electrical safety check has not been conducted within the last 2 years at the time a renter occupies the rental property, an electrical safety check is to be completed as soon as possible.\nBefore entering into a rental agreement, a rental provider must disclose to a renter the date of the last electrical safety check, and any outstanding recommendations from the safety check.\nFrom 29 March 2023 all power outlets and lighting circuits in a rental premises must connect to both a switchboard-type circuit breaker that complies with AS/NZS 3000 and a switchboard-type residual current device that complies with AS/NZS 3190, AS/NZS 61008.1 or AS/NZS 61009.1."
        },
        {
          "claim_id": "VI03",
          "url": "https://www.consumer.vic.gov.au/housing/renting/repairs-alterations-safety-and-pets/gas-electrical-and-water-safety-standards/rental-providers-gas-and-electrical-safety",
          "accessed": "2026-09-26T20:07:10.378390+00:00",
          "quote": "Who can conduct an electrical safety check?\nElectricians must be licensed with Energy Safe Victoria as Registered Electrical Contractors (RECs). The safety check must be conducted by a licensed or registered electrician.\nYou can check an electrician’s registration or licensing status on their card. You can also\ncheck their licensing or registration details on the Energy Safe Victoria website\n.\nFinding a licensed electrician\nYou can find a licensed electrician by searching the web or by visiting\nEnergy Safe Victoria\n.\nWhat an electrical safety check must cover\nThe\nResidential Tenancies Regulations 2021\nset out what must be included in a safety check.\nElectrical safety checks must include a check of all electrical installations, fixtures and fittings carried out in accordance with section 4 of AS/NZS 3019 \"Electrical installations—Periodic verification”.\nFor more information on electrical safety checks, visit\nEnergy Safe Victoria\n.\nEvidence of electrical safety checks\nThe electrician should provide a record of the electrical safety check, which must include:\nthe name of the licensed or registered electrician who conducted the check and their licence or registration number\nthe date of the safety check\nthe results of the check, including any repairs that were required and actions taken to address the repair\na report prepared in accordance with section 2 of AS/NZS 3019, \"Electrical installations—Periodic verification\", as published or amended from time to time.\nRecord keeping\nA rental provider must keep a record of the most recent electrical safety check, until a record of the next safety check is created.\nA copy of the most recent electrical safety check must be provided to the renter within 7 days after the rental provider receives a written request from the renter."
        },
        {
          "claim_id": "VI04",
          "url": "https://www.consumer.vic.gov.au/housing/renting/repairs-alterations-safety-and-pets/repairs/repairs-in-rental-properties",
          "accessed": "2026-09-26T20:05:36.066647+00:00",
          "quote": "Repairs are either ‘urgent’ or ‘non-urgent’. Rental providers must make urgent repairs immediately. Rental providers must make non-urgent repairs within 14 days of getting a written request."
        },
        {
          "claim_id": "VI05",
          "url": "https://www.consumer.vic.gov.au/housing/renting/repairs-alterations-safety-and-pets/repairs/repairs-in-rental-properties",
          "accessed": "2026-09-26T20:05:36.066647+00:00",
          "quote": "List of urgent repairs\nUrgent repairs must be done immediately because they make the property unsafe or difficult to live in.\nAnything on this list is legally defined as an urgent repair:\nburst water service\nblocked or broken toilet system\nserious roof leak\ngas leak\ndangerous electrical fault\nflooding or serious flood damage\nserious storm or fire damage\nan essential service or appliance for hot water, water, cooking, heating, or laundering is not working\nthe gas, electricity or water supply is not working\na cooling appliance or service provided by the rental provider is not working\nthe property does not meet\nminimum standards\na safety-related device, such as a smoke alarm or pool fence, is not working\nan appliance, fitting or fixture that is not working and causes a lot of water to be wasted\nany fault or damage in the property that makes it unsafe or insecure, including\npests, mould or damp\ncaused by or related to the building structure\na serious problem with a lift or staircase."
        },
        {
          "claim_id": "VI06",
          "url": "https://www.consumer.vic.gov.au/housing/renting/repairs-alterations-safety-and-pets/repairs/repairs-in-rental-properties",
          "accessed": "2026-09-26T20:05:36.066647+00:00",
          "quote": "Who can make a repair\nFor work that requires a license or registration, the renter or rental provider must use a qualified person.\nAll repairs must be made to the standard a tradesperson would make them.\nA renter or rental provider can make a repair (that doesn't require a licence or registration) as long as they do it to the same standard as a tradesperson."
        }
      ],
      "scope": "Ordinary rental agreement entered after 29 March 2021; excludes legacy and rooming houses",
