[mutmut]
source_paths=src/boundarybench/
also_copy=examples
pytest_add_cli_args_test_selection=tests/
# mutmut cannot track behavioural changes in non-Python files, so by default it
# keeps cached verdicts and only warns when one changes. The example cards, the
# suite manifest and this config are all real inputs to the tests, so a cached
# verdict taken before they changed is not evidence about the current tree.
# Rerun rather than warn, and let the run cost what correctness costs.
on_dependency_change=rerun
