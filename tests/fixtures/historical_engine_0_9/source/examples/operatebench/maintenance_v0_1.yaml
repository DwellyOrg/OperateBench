        delay_minutes: 1440
        payload:
          evidence_id: evidence_2
          visit_id: visit_3
          cycle_id: work_cycle_3
          scope_digest: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
          outcome: COMPLETED

      - event_id: v1_e17
        type: customer_resolution_reported
        actor: customer_1
        on_event: {type: work_evidence_verified, cycle_id: work_cycle_3}
        delay_minutes: 120
        payload:
          issue_id: issue_1
          status: RESOLVED
          related_visit_id: visit_3

      # Arrives after the finalization timer: a late event against a
