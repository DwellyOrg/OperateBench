        delay_minutes: 60
        payload:
          validation_id: validation_1
          invoice_id: invoice_1
          valid: true
          reason_code: MATCHES_APPROVED_QUOTE

      - event_id: v1_e12
        type: payment_settlement_confirmed
        actor: payment_system
        on_action: {type: request_payment, cycle_id: work_cycle_2}
        delay_minutes: 120
        payload:
          settlement_id: settlement_1
          payment_request_id: payment_1
          invoice_id: invoice_1
          cycle_id: work_cycle_2
          amount_minor: 64000
          currency: GBP

      # Inside the provisional window: the operation reopens rather than closing.
      - event_id: v1_e13
        type: customer_resolution_reported
        actor: customer_1
        on_action: {type: complete, cycle_id: work_cycle_2}
        delay_minutes: 60
        payload:
          issue_id: issue_1
          status: PERSISTS
          related_visit_id: visit_2

      - event_id: v1_e14
        type: supplier_visit_response
        actor: supplier_1
        on_action: {type: request_supplier_visit, cycle_id: work_cycle_3}
        delay_minutes: 120
        payload:
          visit_id: visit_3
